<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- Minara Emblem -->
  <g fill="#16205b">
    <!-- Base plinth -->
    <rect x="110" y="210" width="180" height="18" rx="2" />
    
    <!-- Outer Arch & Monogram Body -->
    <path d="M 200 76 L 244 116 L 244 126 L 226 126 L 200 102 L 174 126 L 156 126 L 156 116 Z" />
    <path d="M 200 84 L 254 134 C 262 142 266 154 266 166 L 266 210 L 236 210 L 236 174 C 236 156 226 142 200 120 C 174 142 164 156 164 174 L 164 210 L 134 210 L 134 166 C 134 154 138 142 146 134 Z" />
    
    <!-- Central Pillar & Inner Inverted Arch -->
    <path d="M 188 152 L 200 140 L 212 152 L 212 196 L 188 196 Z" />
    <path d="M 164 198 L 188 198 L 188 210 L 164 210 Z" />
    <path d="M 212 198 L 236 198 L 236 210 L 212 210 Z" />
    <rect x="156" y="196" width="88" height="14" />
  </g>

  <!-- Typography -->
  <!-- MINARA -->
  <text x="200" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Poppins', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="4" fill="#16205b">
    MINARA
  </text>
  
  <!-- Chamber of Commerce -->
  <text x="200" y="338" text-anchor="middle" font-family="'Georgia', 'Times New Roman', 'Baskerville', serif" font-size="23" fill="#16205b">
    Chamber <tspan font-style="italic" font-size="20">of</tspan> Commerce
  </text>
</svg>
